# .lunova.yml: tells the Lunova server how to run this project.
# Generated by the lunova-deploy skill. Full reference: lunova-deploy skill, references/manifest.md
site: aricm
type: laravel
domains:
  - aricm.org
php: "8.3"
node: "22"
database: mysql            # the server creates the database and user and injects DB_*
scheduler: true            # routes/console.php schedules fee and diary jobs (php artisan schedule:run every minute)
health_path: /

# Built in CI: PHP dependencies, then the React admin and Tailwind assets (pnpm, resolved with npx so nothing global is needed).
build:
  - composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-plugins
  - npx --yes pnpm@12 install --frozen-lockfile
  - npx --yes pnpm@12 build

# Run on the server inside the new release before it goes live. A failure leaves the live site untouched.
# db:seed adds roles, permissions, institute settings, grading scale, fee heads and diary phrases without overwriting
# anything an admin edited (and never loads demo data in production). accounts:create-admin --if-none creates the first
# admin from INITIAL_ADMIN_EMAIL / INITIAL_ADMIN_PASSWORD only while there are no users.
hooks:
  - php artisan migrate --force
  - php artisan db:seed --force
  - php artisan accounts:create-admin --if-none
  - php artisan storage:link
  - php artisan config:cache
  - php artisan route:cache
  - php artisan view:cache
  - php artisan event:cache

exclude:
  - design
  - tests
  - storage/e2e-screenshots
